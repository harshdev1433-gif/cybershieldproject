<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberShield - Secure Login</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/cybershield.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <span class="shield">&#127697;</span>
      <h1>CYBERSHIELD</h1>
      <p>ZERO-TRUST IDENTITY PLATFORM</p>
    </div>
    {% if success_msg %}<div class="alert alert-success">&#10003; {{ success_msg }}</div>{% endif %}
    {% if message %}<div class="alert alert-danger">&#128680; {{ message }}</div>{% endif %}
    <form method="POST" action="/">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>
      <input type="hidden" name="real_lat" id="real_lat" value="32.7266">
      <input type="hidden" name="real_lng" id="real_lng" value="74.8570">
      <input type="hidden" name="real_location" id="real_location" value="Jammu">
      <input type="hidden" name="real_time" id="real_time">
      <input type="hidden" name="real_device" id="real_device" value="">
      <div style="text-align:center;margin-bottom:16px;">
        <small id="geo-status" style="color:#445577;font-size:0.68rem;">&#128225; Detecting location...</small>
      </div>
      <button type="submit" class="btn btn-primary w-full" style="justify-content:center;padding:13px;">&#128272; AUTHENTICATE</button>
    </form>
    <hr class="divider">
    <div class="text-center mt-2">
      <span style="color:#445577;font-size:0.72rem;">No account?</span>
      <a href="/register" style="color:#00c8ff;font-size:0.72rem;margin-left:8px;">Create Account &rarr;</a>
    </div>
    <div class="text-center mt-2" style="font-size:0.65rem;color:#445577;">
      <span class="pulse-dot"></span>Zero-Trust Engine Active
    </div>
  </div>
</div>
<script>document.getElementById("real_time").value=new Date().toTimeString().slice(0,5);</script>
<script src="/static/js/geolocation.js"></script>
</body>
</html>
