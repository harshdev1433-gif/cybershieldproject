<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberShield - Register</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/cybershield.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box" style="max-width:500px;">
    <div class="auth-logo">
      <span class="shield">&#127697;</span>
      <h1>CYBERSHIELD</h1>
      <p>REGISTER NEW IDENTITY &middot; ZERO-TRUST ENROLLMENT</p>
    </div>
    {% if message %}<div class="alert alert-danger">&#128680; {{ message }}</div>{% endif %}
    <form method="POST" action="/register">
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" placeholder="johndoe" required minlength="3">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" placeholder="user@example.com" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control" placeholder="+91-9876543210">
      </div>
      <div class="form-group">
        <label class="form-label">Baseline Location (Home City)</label>
        <input type="text" name="baseline_location" id="baseline_location" class="form-control" placeholder="Detecting..." value="Jammu">
        <small id="geo-status" style="color:#445577;font-size:0.68rem;margin-top:4px;display:block;">&#128225; Auto-detecting your location...</small>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
      </div>
      <input type="hidden" name="real_lat" id="real_lat" value="32.7266">
      <input type="hidden" name="real_lng" id="real_lng" value="74.8570">
      <button type="submit" class="btn btn-primary w-full" style="justify-content:center;padding:13px;margin-top:8px;">&#127697; CREATE SECURE ACCOUNT</button>
    </form>
    <hr class="divider">
    <div class="text-center mt-2">
      <span style="color:#445577;font-size:0.72rem;">Already enrolled?</span>
      <a href="/" style="color:#00c8ff;font-size:0.72rem;margin-left:8px;">Sign In &rarr;</a>
    </div>
  </div>
</div>
<script src="/static/js/geolocation.js"></script>
</body>
</html>
